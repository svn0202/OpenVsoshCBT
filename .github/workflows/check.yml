name: check

permissions:
  contents: read

concurrency:
  group: check-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches:
      - 'main'
      - 'modern'
  pull_request:
    types: [opened, synchronize, reopened]
    branches:
      - main
      - modern

jobs:
  browser-recovery:
    name: Browser recovery
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - name: Install browser test runtime
        run: |
          python3 -m venv /tmp/recovery-tests
          /tmp/recovery-tests/bin/pip install playwright==1.58.0
          /tmp/recovery-tests/bin/python -m playwright install --with-deps chromium firefox webkit
      - name: Verify client recovery and saving
        run: |
          /tmp/recovery-tests/bin/python test/client_recovery_regression.py
          /tmp/recovery-tests/bin/python test/answer_deadline_regression.py
          /tmp/recovery-tests/bin/python test/answer_navigation_regression.py

  test-php:
    name: Test on php ${{ matrix.php-version }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        php-version: ["8.2", "8.3", "8.4"]
    steps:
      - uses: actions/checkout@v7
      - name: Use php ${{ matrix.php-version }}
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php-version }}
          coverage: none
          extensions: bcmath, curl, date, dom, gd, hash, intl, json, mbstring, mysqli, openssl, pcre, xml, zip, zlib
          ini-values: display_errors=on, error_reporting=-1
      - name: List php modules
        run: php -m
      - name: Cache Composer modules
        uses: actions/cache@v6
        with:
          path: ~/.composer/cache/
          key: ${{ runner.os }}-php-${{ matrix.php-version }}-composer-${{ hashFiles('**/composer.lock') }}
          restore-keys: |
            ${{ runner.os }}-php-${{ matrix.php-version }}-composer-
      - name: Install dependencies
        # The mago installer (pulled in via tc-lib-pdf-font's deps) verifies the
        # release attestation with `gh`, which needs GH_TOKEN on Actions runners.
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for attempt in 1 2 3; do
            if make deps; then
              exit 0
            fi
            if [ "$attempt" -eq 3 ]; then
              exit 1
            fi
            echo "Dependency installation failed; retrying ($attempt/3)…"
            sleep $((attempt * 5))
          done
      # Baselines freeze reviewed legacy debt; any newly introduced lint or analysis error fails CI.
      - name: Lint and static analysis
        run: make lint
      - name: Run unit tests
        run: make test
      - name: Verify retired endpoint recovery
        run: python3 test/legacy_recovery_endpoint_regression.py

  integration:
    name: Integration tests (${{ matrix.db }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        db: [mysql, postgres]
    steps:
      - uses: actions/checkout@v7
      # Builds the runner image, seeds a throwaway DB from install/*.sql, runs the unit +
      # integration suites against it, copies the reports back, then tears the env down.
      - name: Run dockerised integration tests
        run: make dockertest DB_TYPE=${{ matrix.db }}
      - name: Report integration failures
        if: failure()
        run: |
          python3 - <<'PY'
          import pathlib
          import xml.etree.ElementTree as ET

          reports = list(pathlib.Path('target').rglob('*junit*.xml'))
          for report in reports:
              for case in ET.parse(report).iter('testcase'):
                  for tag in ('failure', 'error'):
                      for issue in case.findall(tag):
                          title = case.get('classname', '') + '::' + case.get('name', '')
                          message = ''.join(issue.itertext())[:4000]
                          def escape(value):
                              return value.replace('%', '%25').replace('\r', '%0D').replace('\n', '%0A')
                          print('::error::' + escape(title + '\n' + message))
          if not reports:
              print('::error::No JUnit report produced; inspect Docker build and startup logs.')
          PY
