# EXAMPLE ONLY: configure actual trusted proxy addresses privately before deployment.
# Do not install this documentation-address example unchanged.
# Nginx (192.0.2.10) -> host Apache -> loopback Podman port -> container.
# Both proxies append their peer to X-Forwarded-For; mod_remoteip walks right to left.
RemoteIPHeader X-Forwarded-For
RemoteIPInternalProxy 10.88.0.1
RemoteIPInternalProxy 192.0.2.10
