# Install in /etc/nginx/conf.d/ (http context).
# Strings allow '-' and multiple upstream timings/statuses on retries.
log_format vsosh_request escape=json
  '{"timestamp":"$time_iso8601","request_id":"$request_id",'
  '"method":"$request_method","path":"$uri","status":$status,'
  '"request_time":"$request_time","upstream_addr":"$upstream_addr",'
  '"upstream_status":"$upstream_status","upstream_connect_time":"$upstream_connect_time",'
  '"upstream_header_time":"$upstream_header_time","upstream_response_time":"$upstream_response_time",'
  '"application_request_id":"$upstream_http_x_request_id"}';
