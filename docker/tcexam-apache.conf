# Apache configuration for the TCExam runtime image (plan Stage 7).
# The document root is the application root (/var/www/html); the root index.php redirects to
# public/code/. AllowOverride All lets the shipped .htaccess files take effect.

ServerName tcexam.local
ServerTokens Prod
ServerSignature Off

# Cover static files and Apache-generated error responses as well as PHP endpoints. PHP sends the
# same baseline headers for deployments that do not use this container configuration.
Header always set X-Content-Type-Options "nosniff"
Header always set X-Frame-Options "SAMEORIGIN"
Header always set Referrer-Policy "same-origin"
Header always set Content-Security-Policy "frame-ancestors 'self'"

<Directory /var/www/html>
    Options -Indexes +FollowSymLinks
    AllowOverride All
    Require all granted
</Directory>

# Defence in depth: never serve the application configuration or the version-control metadata.
<DirectoryMatch "/var/www/html/(shared|admin|public)/config(\.default)?">
    Require all denied
</DirectoryMatch>
<DirectoryMatch "/var/www/html/\.git">
    Require all denied
</DirectoryMatch>
<Directory "/var/www/html/install">
    AllowOverride None
    Require all denied
</Directory>
<Directory "/var/www/html/cache/attachments">
    Options -Indexes -ExecCGI
    AllowOverride None
    Require all denied
</Directory>
<Directory "/var/www/html/cache/site-assets">
    Options -Indexes -ExecCGI
    AllowOverride None
    Require all denied
</Directory>

# Correlation log alongside the existing access log. No query string or request body.
# Host Apache's reverse proxy must forward X-Request-ID unchanged.
LogFormat "request_id=%{X-Request-ID}i application_request_id=%{X-Request-ID}o method=%m path=%U status=%>s duration_us=%D" openvsosh_request
# The default vhost has its own CustomLog, so a server-level CustomLog is not inherited.
GlobalLog /proc/self/fd/1 openvsosh_request

# Public HTML must not outlive the PHP/JS release. Never reload an active exam.
<Directory /var/www/html/public/code>
    Header always set Cache-Control "no-store, no-cache, must-revalidate, max-age=0"
</Directory>
<FilesMatch "^(sw\.js|manifest\.webmanifest|site\.webmanifest)$">
    Header always set Cache-Control "no-cache, max-age=0, must-revalidate"
</FilesMatch>

# iOS may request size-specific icon aliases even when a generic icon is linked.
Alias /apple-touch-icon-120x120.png /var/www/html/apple-touch-icon.png
Alias /apple-touch-icon-120x120-precomposed.png /var/www/html/apple-touch-icon.png
Alias /apple-touch-icon-152x152.png /var/www/html/apple-touch-icon.png
Alias /apple-touch-icon-152x152-precomposed.png /var/www/html/apple-touch-icon.png

# Retired clients receive an explicit recovery UI, never obsolete save/timer code.
Alias /shared/jscripts/es5.js /var/www/html/shared/jscripts/legacy-client-recovery.js
Alias /shared/jscripts/timer.min.js /var/www/html/shared/jscripts/legacy-client-recovery.js
Alias /shared/jscripts/plugins.ajax-json-cache-api-loadall.js /var/www/html/shared/jscripts/legacy-client-recovery.js

# Apple selects/resizes the original PNG; these are URL aliases, not size declarations.
AliasMatch ^/(?:public/(?:code/)?)?apple-touch-icon(?:-(?:57x57|60x60|72x72|76x76|114x114|120x120|144x144|152x152|167x167|180x180))?(?:-precomposed)?\.png$ /var/www/html/apple-touch-icon.png

<Files "traffic-advice">
    ForceType application/trafficadvice+json
    Header always set Cache-Control "public, max-age=3600"
</Files>
